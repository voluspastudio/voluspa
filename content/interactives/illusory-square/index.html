<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make the square appear</title>
<style>
  :root { --paper: #F7F6F3; --ink: #111111; --muted: #4F4B44; --accent: #E8601C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
  .wrap { height: 100%; display: flex; flex-direction: column; }
  svg { flex: 1 1 auto; width: 100%; min-height: 0; display: block; touch-action: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 10px 4px 2px; font-size: 12px; color: var(--muted); }
  button { min-height: 44px; padding: 0 14px; border: 1px solid var(--ink); background: transparent; font: inherit; color: var(--ink); cursor: pointer; }
  button:hover { background: var(--ink); color: var(--paper); }
  button:focus-visible, .disk:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .disk { cursor: grab; }
  .disk:active { cursor: grabbing; }
</style>
</head>
<body>
<div class="wrap">
<svg id="s" viewBox="0 0 600 420" role="application" aria-label="Four disks with wedges removed. Drag them, or focus one and use the arrow keys, until a square appears between them."></svg>
<div class="bar"><span id="msg" aria-live="polite">Drag the disks until a square appears.</span><span><button type="button" id="scatter">Scatter</button> <button type="button" id="align">Align</button></span></div>
</div>
<script>
(function () {
  var svg = document.getElementById('s'), msg = document.getElementById('msg'), NS = 'http://www.w3.org/2000/svg';
  var C = 300, M = 210, half = 90, r = 46;
  var home = [[C - half, M - half, 0], [C + half, M - half, 90], [C + half, M + half, 180], [C - half, M + half, 270]];
  var disks = home.map(function (h, i) {
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'disk'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button');
    g.setAttribute('aria-label', 'Disk ' + (i + 1) + '. Use arrow keys to move.');
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M0 0 L' + r + ' 0 A' + r + ' ' + r + ' 0 1 0 0 ' + r + ' Z');
    p.setAttribute('fill', i === 0 ? '#E8601C' : '#111111');
    g.appendChild(p); svg.appendChild(g);
    return { g: g, x: h[0], y: h[1], rot: h[2], hx: h[0], hy: h[1] };
  });
  function draw() {
    var err = 0;
    disks.forEach(function (d) {
      d.g.setAttribute('transform', 'translate(' + d.x.toFixed(1) + ' ' + d.y.toFixed(1) + ') rotate(' + d.rot + ')');
      err += Math.hypot(d.x - d.hx, d.y - d.hy);
    });
    msg.textContent = err < 24 ? 'There it is: a square nobody drew.' : err < 120 ? 'Almost. Keep aligning the corners.' : 'Drag the disks until a square appears.';
  }
  function scatter() { disks.forEach(function (d, i) { d.x = 60 + Math.random() * 480; d.y = 50 + Math.random() * 320; }); draw(); }
  function pt(e) { var b = svg.getBoundingClientRect(); return [(e.clientX - b.left) * 600 / b.width, (e.clientY - b.top) * 420 / b.height]; }
  var drag = null;
  disks.forEach(function (d) {
    d.g.addEventListener('pointerdown', function (e) { var p = pt(e); drag = { d: d, ox: d.x - p[0], oy: d.y - p[1] }; d.g.setPointerCapture(e.pointerId); });
    d.g.addEventListener('pointermove', function (e) { if (!drag || drag.d !== d) return; var p = pt(e); d.x = p[0] + drag.ox; d.y = p[1] + drag.oy; draw(); });
    d.g.addEventListener('pointerup', function () { drag = null; });
    d.g.addEventListener('keydown', function (e) {
      var k = { ArrowLeft: [-6, 0], ArrowRight: [6, 0], ArrowUp: [0, -6], ArrowDown: [0, 6] }[e.key];
      if (k) { e.preventDefault(); d.x += k[0]; d.y += k[1]; draw(); }
    });
  });
  document.getElementById('scatter').addEventListener('click', scatter);
  document.getElementById('align').addEventListener('click', function () { disks.forEach(function (d) { d.x = d.hx; d.y = d.hy; }); draw(); });
  scatter();
})();
</script>
</body>
</html>
